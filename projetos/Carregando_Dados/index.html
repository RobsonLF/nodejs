<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Json</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
    <section class="container">
        <div class="cabecalho">
            <h1>Contatos</h1>
            <button class="botao botao-principal" type="button" id="abrirModal">Adicionar contato</button>
        </div>
        <p class="mensagem" id="mensagem" role="status" aria-live="polite"></p>
        <div class="tabela-container">
            <table class="tabelaContatos">
            <thead>
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Email</th>
                    <th scope="col">Salário</th>
                    <th scope="col">Estado</th>
                    <th scope="col">Empresa</th>
                    <th scope="col">Idade</th>
                    <th scope="col">Sexo</th>
                    <th scope="col">CPF</th>
                </tr>
            </thead>
            <tbody class="bodyTabelaContatos"></tbody>
            </table>
        </div>
    </section>
    <dialog class="modal" id="modalContato" aria-labelledby="tituloModal">
        <div class="modal-cabecalho">
            <h2 id="tituloModal">Adicionar contato</h2>
            <button class="botao-fechar" type="button" id="fecharModal" aria-label="Fechar">&times;</button>
        </div>
        <form id="formContato">
            <div class="campos">
                <label>Nome
                    <input name="nome" type="text" maxlength="120" autocomplete="name" required>
                </label>
                <label>Email
                    <input name="email" type="email" maxlength="254" autocomplete="email" required>
                </label>
                <label>Salário
                    <input name="salario" type="number" min="0" step="0.01" required>
                </label>
                <label>Estado
                    <input name="estado" type="text" maxlength="80" required>
                </label>
                <label>Empresa
                    <input name="empresa" type="text" maxlength="120" required>
                </label>
                <label>Idade
                    <input name="idade" type="number" min="0" max="150" step="1" required>
                </label>
                <label>Sexo
                    <select name="sexo">
                        <option value="">Não informado</option>
                        <option value="F">F</option>
                        <option value="M">M</option>
                    </select>
                </label>
                <label>CPF
                    <input name="cpf" type="text" maxlength="20" required>
                </label>
            </div>
            <p class="mensagem mensagem-erro" id="erroFormulario" role="alert"></p>
            <div class="acoes-modal">
                <button class="botao botao-secundario" type="button" id="cancelarModal">Cancelar</button>
                <button class="botao botao-principal" type="submit" id="salvarContato">Salvar contato</button>
            </div>
        </form>
    </dialog>
    <script src="./assets/js/main.js"></script>
</body> 
</html>
