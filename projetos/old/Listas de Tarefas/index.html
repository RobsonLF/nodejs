<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
  </head>
  <body>
    
    <section>
      <div class="container">
          <div class="row">
            <div class="col align-self-center main">
              <h1>To Do List</h1>
              <form class="row g-3 justify-content-center mx-auto" style="max-width: 520px;">
                <div class="col-8 input-group form-input">
                  <span class="input-group-text" id="basic-addon1">Task</span>
                  <input type="text" class="form-control" id="input-tarefa" placeholder="Task Description" aria-label="Username" aria-describedby="basic-addon1">
                  <button type="button" class="btn-outline theme-secondary" id="btn-tarefa">Adicionar</button>
                <!--<button type="button" class="btn-outline theme-inverse">Adicionar</button>-->
                </div>  
              </form>
              <p>
                <ul class="tarefas">

                </ul>
              </p>
            </div>
          </div>
      </div>
    </section>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
